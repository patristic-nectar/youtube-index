name: Update Unified Index Data

on:
  # Run three times a day (02:17, 06:17, 22:17 UTC), off the hour where GitHub delays fewer runs
  schedule:
    - cron: '17 2,6,22 * * *'

  # Allow manual triggering for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # GitHub can delay a scheduled run by hours: skip any that lands Mon-Fri 07:00-15:30 Central
  window:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        run: |
          d=$(TZ=America/Chicago date +%u); t=$(TZ=America/Chicago date +%H%M)
          if [ "${{ github.event_name }}" = schedule ] && [ "$d" -le 5 ] && [ "$t" -ge 0700 ] && [ "$t" -lt 1530 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  fetch-data:
    needs: window
    if: needs.window.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-youtube-data.js

      - name: Fetch Patristic API data
        run: node scripts/fetch-patristic-api-data.js

      - name: Build unified index files
        run: node scripts/build-unified-index.js

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet data/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git commit -m "Update unified index data [automated]"
          git push

      - name: No changes detected
        if: steps.git-check.outputs.changed != 'true'
        run: echo "No changes to data files - skipping commit"
